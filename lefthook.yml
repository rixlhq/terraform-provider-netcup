pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{go}"
      run: mise exec -- golangci-lint run --new
      stage_fixed: true
    format:
      glob: "*.{go}"
      run: mise exec -- gofmt -s -w {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    test:
      run: mise run test
    build:
      run: mise run build
