pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{go}"
      run: mise exec -- golangci-lint run --new
      stage_fixed: true
    format:
      glob: "*.{go}"
      run: mise exec -- gofmt -s -w {staged_files}
      stage_fixed: true
    jactionlint:
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - ".github/actions/**/action.{yml,yaml}"
        - ".github/dependabot.{yml,yaml}"
      run: mise exec -- jactionlint --profile correctness --shellcheck= {staged_files}
pre-push:
  parallel: true
  commands:
    test:
      run: mise run test
    build:
      run: mise run build
