name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - run: go mod download
      - parallel:
          - name: Lint
            uses: golangci/golangci-lint-action@v9
            with:
              version: latest
              only-new-issues: true
          - name: Test
            run: go test ./...
          - name: Build
            run: CGO_ENABLED=0 go build -o ./build/terraform-provider-netcup .
