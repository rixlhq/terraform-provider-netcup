name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - run: go mod download
      - name: Check formatting
        run: test -z "$(gofmt -s -l -e .)"
      - parallel:
          - name: Lint
            uses: golangci/golangci-lint-action@v9
            with:
              version: latest
              only-new-issues: true
          - name: Test
            run: go test ./...
          - name: Build
            run: CGO_ENABLED=0 go build -o ./build/terraform-provider-netcup .
